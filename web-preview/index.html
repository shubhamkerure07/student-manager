<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentHub — Native Android App Interactive Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .top-toolbar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 20px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
    }

    .top-toolbar h1 {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-kotlin {
      background: #7f52ff;
      color: white;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .badge-compose {
      background: #4285f4;
      color: white;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .device-switcher {
      display: flex;
      gap: 8px;
    }

    .switch-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .switch-btn.active, .switch-btn:hover {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    /* Device frame */
    .device-container {
      width: 100%;
      max-width: 440px;
      background: #f1f5f9;
      color: var(--text);
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 8px #1e293b;
      display: flex;
      flex-direction: column;
      height: 840px;
      position: relative;
      transition: max-width 0.3s ease;
    }

    .device-container.tablet-mode {
      max-width: 760px;
    }

    /* Android Status bar */
    .status-bar {
      height: 36px;
      background: #1e293b;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    /* App Header */
    .app-header {
      background: #1e293b;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title-box h2 {
      font-size: 18px;
      font-weight: 800;
    }

    .app-title-box span {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }

    .app-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Material Cards */
    .mat-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .hero-stat-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
    }

    .hero-stat-card .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.15);
      padding: 10px 8px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    .stat-pill .val {
      font-size: 16px;
      font-weight: 800;
      display: block;
    }

    .stat-pill .lbl {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
      margin-top: 2px;
      display: block;
    }

    /* Bottom Nav Bar */
    .bottom-nav {
      height: 64px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #64748b;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .nav-item.active {
      color: #2563eb;
      background: #eff6ff;
    }

    .nav-item .icon {
      font-size: 18px;
    }

    /* Timetable styles */
    .day-selector {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .day-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #e2e8f0;
      background: white;
      cursor: pointer;
      color: #475569;
    }

    .day-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .class-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border-left: 4px solid #2563eb;
      margin-bottom: 8px;
    }

    .class-time {
      font-size: 11px;
      font-weight: 800;
      color: #2563eb;
      min-width: 80px;
    }

    .class-details h4 {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }

    .class-details p {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    /* Attendance item */
    .attendance-card {
      margin-bottom: 10px;
    }

    .att-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .att-gauge-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .att-gauge-fill {
      height: 100%;
      background: #10b981;
      border-radius: 4px;
      transition: width 0.3s;
    }

    .att-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-att {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-present { background: #dcfce7; color: #15803d; }
    .btn-absent { background: #fee2e2; color: #b91c1c; }

    /* Essentials checklist */
    .chk-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .chk-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .chk-item.checked .chk-box {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }

    .chk-item.checked span {
      text-decoration: line-through;
      color: #94a3b8;
    }

    canvas {
      width: 100%;
      height: 160px;
      border-radius: 12px;
      background: #f8fafc;
    }
  </style>
</head>
<body>

  <!-- Top toolbar -->
  <div class="top-toolbar">
    <h1>
      <span>🎓 StudentHub Android Preview</span>
      <span class="badge-kotlin">Kotlin 2.0</span>
      <span class="badge-compose">Jetpack Compose</span>
    </h1>
    <div class="device-switcher">
      <button class="switch-btn active" onclick="setMode('phone')">📱 Mobile View</button>
      <button class="switch-btn" onclick="setMode('tablet')">💻 Wide View</button>
    </div>
  </div>

  <!-- Device frame -->
  <div class="device-container" id="device">
    <div class="status-bar">
      <span>10:42</span>
      <span>5G 📶 98% 🔋</span>
    </div>

    <div class="app-header">
      <div class="app-title-box">
        <h2 id="screen-title">Dashboard</h2>
        <span>Academic Planner & Attendance</span>
      </div>
      <div style="background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800;">
        4MT22CS148
      </div>
    </div>

    <div class="app-body" id="app-content">
      <!-- Injected dynamically by tab switcher -->
    </div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('dashboard')">
        <span class="icon">📊</span>
        <span>Overview</span>
      </div>
      <div class="nav-item" onclick="switchTab('timetable')">
        <span class="icon">🕒</span>
        <span>Timetable</span>
      </div>
      <div class="nav-item" onclick="switchTab('attendance')">
        <span class="icon">🛡️</span>
        <span>Attendance</span>
      </div>
      <div class="nav-item" onclick="switchTab('spending')">
        <span class="icon">💰</span>
        <span>Spending</span>
      </div>
      <div class="nav-item" onclick="switchTab('essentials')">
        <span class="icon">🎒</span>
        <span>Essentials</span>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'dashboard';
    let currentDay = 'Monday';

    // State data
    let attendanceData = [
      { id: 'cs301', name: 'Design & Analysis of Algorithms', attended: 28, conducted: 32 },
      { id: 'cs302', name: 'Operating Systems & Concurrency', attended: 26, conducted: 30 },
      { id: 'cs303', name: 'Database Management Systems', attended: 22, conducted: 28 },
      { id: 'me304', name: 'Mechatronics Sensors & Actuators', attended: 31, conducted: 34 }
    ];

    let essentials = [
      { id: 1, text: 'College USN ID Card', checked: true },
      { id: 2, text: 'Scientific Calculator (fx-991EX)', checked: true },
      { id: 3, text: 'Semester Hall Ticket', checked: true },
      { id: 4, text: 'DSA Laboratory Manual', checked: false },
      { id: 5, text: 'Blue / Black Ball Pens', checked: true },
      { id: 6, text: 'Laptop & Charger', checked: false }
    ];

    let expenses = [
      { day: 'Mon', amount: 140 },
      { day: 'Tue', amount: 220 },
      { day: 'Wed', amount: 90 },
      { day: 'Thu', amount: 310 },
      { day: 'Fri', amount: 180 },
      { day: 'Sat', amount: 450 }
    ];

    const timetable = {
      Monday: [
        { time: '09:00 - 10:00', title: 'Algorithms (CS301)', room: 'LH-204', staff: 'Prof. Rajesh K.' },
        { time: '10:00 - 11:00', title: 'Operating Systems (CS302)', room: 'LH-201', staff: 'Dr. Savitha' },
        { time: '11:15 - 12:15', title: 'Mechatronics Sensors (ME304)', room: 'Mech Lab 2', staff: 'Prof. Suresh' },
        { time: '01:30 - 04:30', title: 'Algorithms Lab (CSL301)', room: 'Central Computing', staff: 'Staff Team' }
      ],
      Tuesday: [
        { time: '09:00 - 10:00', title: 'Database Systems (CS303)', room: 'LH-204', staff: 'Prof. Ananya' },
        { time: '10:00 - 11:00', title: 'Embedded Microcontrollers', room: 'LH-201', staff: 'Dr. Anand' },
        { time: '11:15 - 12:15', title: 'Operating Systems (CS302)', room: 'LH-201', staff: 'Dr. Savitha' }
      ],
      Wednesday: [
        { time: '09:00 - 10:00', title: 'Algorithms (CS301)', room: 'LH-204', staff: 'Prof. Rajesh K.' },
        { time: '10:00 - 11:00', title: 'Mechatronics Sensors', room: 'Mech Lab', staff: 'Prof. Suresh' },
        { time: '01:30 - 04:30', title: 'Database Systems Lab', room: 'Lab 4', staff: 'Prof. Ananya' }
      ]
    };

    function setMode(mode) {
      const dev = document.getElementById('device');
      const btns = document.querySelectorAll('.switch-btn');
      btns.forEach(b => b.classList.remove('active'));
      if (mode === 'tablet') {
        dev.classList.add('tablet-mode');
        btns[1].classList.add('active');
      } else {
        dev.classList.remove('tablet-mode');
        btns[0].classList.add('active');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach((item, index) => {
        const tabs = ['dashboard', 'timetable', 'attendance', 'spending', 'essentials'];
        if (tabs[index] === tab) item.classList.add('active');
        else item.classList.remove('active');
      });

      const titleMap = {
        dashboard: 'Academic Dashboard',
        timetable: 'Lecture Timetable',
        attendance: 'Attendance Guardian',
        spending: 'Expense & Budget Tracker',
        essentials: 'Daily College Essentials'
      };
      document.getElementById('screen-title').innerText = titleMap[tab];
      renderContent();
    }

    function modifyAttendance(id, isPresent) {
      const item = attendanceData.find(a => a.id === id);
      if (item) {
        item.conducted += 1;
        if (isPresent) item.attended += 1;
        renderContent();
      }
    }

    function toggleEssential(id) {
      const item = essentials.find(e => e.id === id);
      if (item) {
        item.checked = !item.checked;
        renderContent();
      }
    }

    function resetEssentials() {
      essentials.forEach(e => e.checked = false);
      renderContent();
    }

    function renderContent() {
      const container = document.getElementById('app-content');

      if (currentTab === 'dashboard') {
        let totalAtt = attendanceData.reduce((acc, c) => acc + c.attended, 0);
        let totalCond = attendanceData.reduce((acc, c) => acc + c.conducted, 0);
        let overallPct = Math.round((totalAtt / totalCond) * 100);

        container.innerHTML = `
          <div class="hero-stat-card">
            <div class="header-row">
              <div>
                <h3 style="font-size:18px; font-weight:800;">Semester 5 Hub</h3>
                <p style="font-size:11px; opacity:0.85;">Computer Science & Engineering</p>
              </div>
              <span style="background:rgba(255,255,255,0.2); padding:4px 8px; border-radius:6px; font-size:10px; font-weight:700;">ACTIVE</span>
            </div>
            <div class="stats-grid">
              <div class="stat-pill">
                <span class="val">${overallPct}%</span>
                <span class="lbl">Attendance</span>
              </div>
              <div class="stat-pill">
                <span class="val">24</span>
                <span class="lbl">Classes/Wk</span>
              </div>
              <div class="stat-pill">
                <span class="val">₹1,390</span>
                <span class="lbl">Spent Wk</span>
              </div>
            </div>
          </div>

          <div class="mat-card">
            <h4 style="font-size:14px; font-weight:800; margin-bottom:12px;">Next Lecture Today</h4>
            <div class="class-item" style="margin:0;">
              <div class="class-time">11:15 AM<br><span style="font-size:9px; color:#64748b;">(45m left)</span></div>
              <div class="class-details">
                <h4>Mechatronics Sensors & Actuators</h4>
                <p>Room: Mech Lab 2 • Prof. Suresh</p>
              </div>
            </div>
          </div>

          <div class="mat-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h4 style="font-size:14px; font-weight:800;">College Bag Checklist</h4>
              <span style="font-size:11px; color:#2563eb; font-weight:700;">${essentials.filter(e=>e.checked).length}/${essentials.length} Ready</span>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
              ${essentials.slice(0, 4).map(e => `
                <div style="font-size:11px; background:#f8fafc; padding:8px 10px; border-radius:8px; display:flex; align-items:center; gap:6px;">
                  <span>${e.checked ? '✅' : '⏳'}</span>
                  <span style="color:${e.checked ? '#64748b' : '#0f172a'};">${e.text}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } 
      else if (currentTab === 'timetable') {
        const classes = timetable[currentDay] || [];
        container.innerHTML = `
          <div class="day-selector">
            ${['Monday', 'Tuesday', 'Wednesday'].map(d => `
              <button class="day-btn ${currentDay === d ? 'active' : ''}" onclick="currentDay='${d}'; renderContent();">${d}</button>
            `).join('')}
          </div>
          <div class="mat-card">
            <h4 style="font-size:14px; font-weight:800; margin-bottom:14px;">Schedule for ${currentDay}</h4>
            ${classes.map(c => `
              <div class="class-item">
                <div class="class-time">${c.time}</div>
                <div class="class-details">
                  <h4>${c.title}</h4>
                  <p>📍 ${c.room} &nbsp;|&nbsp; 👨‍🏫 ${c.staff}</p>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (currentTab === 'attendance') {
        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:10px;">
            ${attendanceData.map(a => {
              const pct = Math.round((a.attended / a.conducted) * 100);
              const isSafe = pct >= 75;
              return `
                <div class="mat-card attendance-card">
                  <div class="att-header">
                    <div>
                      <h4 style="font-size:13px; font-weight:800;">${a.name}</h4>
                      <p style="font-size:11px; color:#64748b;">${a.attended} of ${a.conducted} classes attended</p>
                    </div>
                    <span style="font-size:15px; font-weight:900; color:${isSafe ? '#10b981' : '#ef4444'};">${pct}%</span>
                  </div>
                  <div class="att-gauge-bar">
                    <div class="att-gauge-fill" style="width:${pct}%; background:${isSafe ? '#10b981' : '#ef4444'};"></div>
                  </div>
                  <div class="att-buttons">
                    <button class="btn-att btn-present" onclick="modifyAttendance('${a.id}', true)">+ Attended</button>
                    <button class="btn-att btn-absent" onclick="modifyAttendance('${a.id}', false)">+ Missed</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
      else if (currentTab === 'spending') {
        container.innerHTML = `
          <div class="mat-card">
            <h4 style="font-size:14px; font-weight:800; margin-bottom:10px;">Weekly Spending Trend</h4>
            <canvas id="spendChart" width="360" height="150"></canvas>
            <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:11px; font-weight:700;">
              <span style="color:#64748b;">Weekly Total: ₹1,390</span>
              <span style="color:#10b981;">Budget Left: ₹2,610</span>
            </div>
          </div>

          <div class="mat-card">
            <h4 style="font-size:14px; font-weight:800; margin-bottom:12px;">Recent Expenses</h4>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; justify-content:space-between; padding:8px; background:#f8fafc; border-radius:8px; font-size:12px;">
                <span>🍔 Canteen Lunch</span>
                <span style="font-weight:800; color:#ef4444;">-₹120</span>
              </div>
              <div style="display:flex; justify-content:space-between; padding:8px; background:#f8fafc; border-radius:8px; font-size:12px;">
                <span>📚 Notebooks & Stationary</span>
                <span style="font-weight:800; color:#ef4444;">-₹180</span>
              </div>
              <div style="display:flex; justify-content:space-between; padding:8px; background:#f8fafc; border-radius:8px; font-size:12px;">
                <span>🚌 City Bus Fare</span>
                <span style="font-weight:800; color:#ef4444;">-₹30</span>
              </div>
            </div>
          </div>
        `;
        setTimeout(drawSpendChart, 50);
      }
      else if (currentTab === 'essentials') {
        const packed = essentials.filter(e => e.checked).length;
        container.innerHTML = `
          <div class="mat-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <div>
                <h4 style="font-size:14px; font-weight:800;">College Bag Checklist</h4>
                <p style="font-size:11px; color:#64748b;">${packed} of ${essentials.length} items packed</p>
              </div>
              <button onclick="resetEssentials()" style="padding:6px 10px; border-radius:8px; border:1px solid #cbd5e1; background:white; font-size:11px; font-weight:700; cursor:pointer;">Reset</button>
            </div>
            ${essentials.map(e => `
              <div class="chk-item ${e.checked ? 'checked' : ''}" onclick="toggleEssential(${e.id})">
                <div class="chk-box">${e.checked ? '✓' : ''}</div>
                <span style="font-size:13px; font-weight:600;">${e.text}</span>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    function drawSpendChart() {
      const cvs = document.getElementById('spendChart');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, cvs.width, cvs.height);

      const max = 500;
      const barW = 32;
      const spacing = 22;
      const startX = 20;

      expenses.forEach((item, i) => {
        const x = startX + i * (barW + spacing);
        const h = (item.amount / max) * 90;
        const y = cvs.height - h - 30;

        // Bar
        const grad = ctx.createLinearGradient(0, y, 0, y + h);
        grad.addColorStop(0, '#2563eb');
        grad.addColorStop(1, '#93c5fd');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x, y, barW, h, [6, 6, 0, 0]);
        ctx.fill();

        // Label
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 10px "Plus Jakarta Sans"';
        ctx.textAlign = 'center';
        ctx.fillText(item.day, x + barW / 2, cvs.height - 10);

        // Value
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 9px "Plus Jakarta Sans"';
        ctx.fillText('₹' + item.amount, x + barW / 2, y - 6);
      });
    }

    // Initialize
    renderContent();
  </script>
</body>
</html>
